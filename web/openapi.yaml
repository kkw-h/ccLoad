components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: ccLoad Web Session Token
    proxyBearer:
      type: http
      scheme: bearer
      bearerFormat: ccLoad API Token
    proxyAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ChannelID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    StringID:
      name: id
      in: path
      required: true
      schema: {type: string}
    KeyIndex:
      name: keyIndex
      in: path
      required: true
      schema: {type: integer, minimum: 0}
    RangeQuery:
      name: range
      in: query
      schema: {type: string, example: today}
    LimitQuery:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 50}
    OffsetQuery:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    TypeQuery:
      name: type
      in: query
      schema: {$ref: '#/components/schemas/Protocol'}
    EnabledQuery:
      name: enabled
      in: query
      schema: {type: boolean}
  requestBodies:
    Channel:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ChannelRequest'}
    ChannelIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [channel_ids]
            properties:
              channel_ids: {type: array, items: {type: integer, format: int64}}
              enabled: {type: boolean}
              protocol_transform_mode: {$ref: '#/components/schemas/ProtocolTransformMode'}
    URLAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    KeyAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key_index]
            properties:
              key_index: {type: integer, minimum: 0}
    Models:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [models]
            properties:
              models: {type: array, items: {$ref: '#/components/schemas/ModelEntry'}}
    Cooldown:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [duration_ms]
            properties:
              duration_ms: {type: integer, format: int64, minimum: 1000}
    GenericObject:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema: {$ref: '#/components/schemas/APIResponse'}
    Error:
      description: 请求失败
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    APIResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, const: true}
        data: {}
        error: {type: string, default: ''}
        count: {type: integer, default: 0}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, const: false}
        data: {}
        error: {type: string}
        count: {type: integer, default: 0}
    LoginRequest:
      type: object
      required: [mode, password]
      properties:
        mode: {type: string, enum: [admin]}
        password: {type: string, format: password}
    Protocol:
      type: string
      enum: [anthropic, openai, gemini, codex]
    ProtocolTransformMode:
      type: string
      enum: [auto, upstream, local]
    ChannelURL:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri}
        exact: {type: boolean, default: false}
        protocols: {type: array, items: {$ref: '#/components/schemas/Protocol'}}
        disabled: {type: boolean, default: false}
    ModelEntry:
      type: object
      required: [model]
      properties:
        model: {type: string}
        redirect_model: {type: string}
        disabled: {type: boolean, default: false}
    ChannelAPIKey:
      type: object
      required: [api_key]
      properties:
        api_key: {type: string, writeOnly: true}
        note: {type: string, maxLength: 512}
    ChannelRequest:
      type: object
      required: [name, auth_type, urls, models]
      properties:
        name: {type: string}
        auth_type: {type: string, enum: [api_key, codex_oauth, antigravity_oauth, xai_oauth]}
        api_key: {type: string, writeOnly: true, deprecated: true}
        api_keys: {type: array, items: {$ref: '#/components/schemas/ChannelAPIKey'}}
        websockets: {type: boolean}
        protocol_transform_mode: {$ref: '#/components/schemas/ProtocolTransformMode'}
        key_strategy: {type: string, enum: [sequential, round_robin]}
        urls: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ChannelURL'}}
        priority: {type: integer}
        rpm_limit: {type: integer, minimum: 0}
        max_concurrency: {type: integer, minimum: 0}
        models: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ModelEntry'}}
        enabled: {type: boolean}
        scheduled_check_enabled: {type: boolean}
        scheduled_check_model: {type: string}
        daily_cost_limit: {type: number, minimum: 0}
        cost_multiplier: {type: number, minimum: 0}
        custom_request_rules: {type: object, additionalProperties: true}
        cooldown_detection_rules: {type: object, additionalProperties: true}
        proxy_url: {type: string}
    CheckDuplicateRequest:
      type: object
      required: [urls]
      properties:
        urls: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ChannelURL'}}
    FetchModelsRequest:
      type: object
      required: [urls, api_key]
      properties:
        urls: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ChannelURL'}}
        protocol: {$ref: '#/components/schemas/Protocol'}
        api_key: {type: string, writeOnly: true}
    BatchRefreshModelsRequest:
      type: object
      required: [channel_ids]
      properties:
        channel_ids: {type: array, minItems: 1, items: {type: integer, format: int64}}
        mode: {type: string, enum: [merge, replace], default: merge}
        protocol: {$ref: '#/components/schemas/Protocol'}
        lowercase_models: {type: boolean}
        strip_model_source_prefix: {type: boolean}
    BillingFetchRequest:
      type: object
      required: [base_url, api_key]
      properties:
        base_url: {type: string, format: uri}
        api_key: {type: string, writeOnly: true}
    AuthTokenRequest:
      type: object
      properties:
        description: {type: string}
        expires_at: {type: [integer, 'null'], format: int64, description: Unix 毫秒；null 表示永不过期}
        is_active: {type: boolean}
        allowed_models: {type: array, items: {type: string}}
        allowed_channel_ids: {type: array, items: {type: integer, format: int64}}
        channel_restriction_mode: {type: string, enum: [allow, deny]}
        cost_limit_usd: {type: number, minimum: 0}
        max_concurrency: {type: integer, minimum: 0}
    SettingRequest:
      type: object
      required: [value]
      properties:
        value: {type: string}
    ReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, xhigh, max]
    ModelReasoningEffortOverrides:
      type: object
      maxProperties: 500
      description: 键为规范化后的原模型名称；空数组表示明确不暴露任何推理强度。
      additionalProperties:
        type: array
        uniqueItems: true
        items: {$ref: '#/components/schemas/ReasoningEffort'}
      example:
        gpt-5.6-sol: [low, medium, high, xhigh]
    ModelMetadataOverride:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        provider: {type: string, minLength: 1}
        contextWindow: {type: integer, format: int64, minimum: 1}
        maxTokens: {type: integer, format: int64, minimum: 1}
        inputTypes:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
    ModelMetadataOverrides:
      type: object
      maxProperties: 500
      description: 键为规范化后的原模型名称；每个对象仅覆盖明确提供的字段，空 inputTypes 表示明确不支持任何输入类型。
      additionalProperties: {$ref: '#/components/schemas/ModelMetadataOverride'}
      example:
        gpt-5.6-sol:
          provider: OpenAI
          contextWindow: 372000
          maxTokens: 128000
          inputTypes: [text]
    SettingsBatchRequest:
      type: object
      additionalProperties: {type: string}
      properties:
        model_reasoning_effort_overrides:
          type: string
          contentMediaType: application/json
          description: 序列化后的 ModelReasoningEffortOverrides JSON 对象；保存后即时生效。
          example: '{"gpt-5.6-sol":["low","high"]}'
        model_metadata_overrides:
          type: string
          contentMediaType: application/json
          description: 序列化后的 ModelMetadataOverrides JSON 对象；保存后即时生效。
          example: '{"gpt-5.6-sol":{"provider":"OpenAI","contextWindow":372000,"maxTokens":128000,"inputTypes":["text"]}}'
    SupportedReasoningEfforts:
      type: array
      description: 可用推理强度；能力未知时省略，明确禁用时返回空数组。
      uniqueItems: true
      items: {$ref: '#/components/schemas/ReasoningEffort'}
    ThinkingLevel:
      type: string
      enum: [off, minimal, low, medium, high, xhigh, max]
    ThinkingLevels:
      type: array
      description: 面向客户端展示的推理强度；none 被转换为 off，能力未知时省略。
      uniqueItems: true
      items: {$ref: '#/components/schemas/ThinkingLevel'}
    InputTypes:
      type: array
      description: 原模型共同支持的输入类型；能力未知时省略，明确不支持时返回空数组。
      uniqueItems: true
      items: {type: string}
    OpenAIModel:
      type: object
      required: [id, object, created, owned_by, displayName]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        created: {type: integer, format: int64}
        owned_by: {type: string}
        supported_reasoning_efforts: {$ref: '#/components/schemas/SupportedReasoningEfforts'}
        displayName: {type: string}
        provider: {type: string, description: 原模型供应商；多供应商时为 mixed。}
        thinkingLevels: {$ref: '#/components/schemas/ThinkingLevels'}
        contextWindow: {type: integer, format: int64, minimum: 1}
        maxTokens: {type: integer, format: int64, minimum: 1}
        inputTypes: {$ref: '#/components/schemas/InputTypes'}
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {$ref: '#/components/schemas/OpenAIModel'}}
    AnthropicModel:
      type: object
      required: [id, display_name, displayName, type, created_at]
      properties:
        id: {type: string}
        display_name: {type: string}
        displayName: {type: string, description: 与 display_name 相同的 camelCase 兼容字段。}
        type: {type: string, const: model}
        created_at: {type: string, format: date-time}
        supported_reasoning_efforts: {$ref: '#/components/schemas/SupportedReasoningEfforts'}
        provider: {type: string, description: 原模型供应商；多供应商时为 mixed。}
        thinkingLevels: {$ref: '#/components/schemas/ThinkingLevels'}
        contextWindow: {type: integer, format: int64, minimum: 1}
        maxTokens: {type: integer, format: int64, minimum: 1}
        inputTypes: {$ref: '#/components/schemas/InputTypes'}
    AnthropicModelList:
      type: object
      required: [data, has_more]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AnthropicModel'}}
        has_more: {type: boolean}
        first_id: {type: string}
        last_id: {type: string}
